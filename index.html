<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>Antigravity 象棋網頁版</title>
    <style>
        body { text-align: center; background: #f4e4bc; font-family: "Microsoft JhengHei", sans-serif; }
        canvas { background: #eac07b; border: 5px double #5d4037; cursor: pointer; box-shadow: 0 10px 20px rgba(0,0,0,0.2); }
        .info { margin: 20px; font-size: 20px; color: #5d4037; font-weight: bold; }
        .anti-btn { padding: 10px 20px; background: #5d4037; color: white; border: none; border-radius: 5px; cursor: pointer; margin-bottom: 10px; }
    </style>
</head>
<body>
    <h1>♟️ Antigravity Online Chess</h1>
    <!-- 模擬 antigravity 彩蛋的按鈕 -->
    <button class="anti-btn" onclick="window.open('https://xkcd.com/353/')">觸發反重力模式 (Python Egg)</button>
    
    <div class="info">操作：點擊棋子後點擊目標位置移動</div>
    <canvas id="chess" width="400" height="450"></canvas>

    <script>
        const canvas = document.getElementById('chess');
        const ctx = canvas.getContext('2d');
        const S = 40, off = 40;
        let board = [
            ['車','馬','象','士','將','士','象','馬','車'],
            [], [], ['卒','','卒','','卒','','卒','','卒'],
            [], [], ['兵','','兵','','兵','','兵','','兵'],
            [], [], ['車','馬','相','仕','帥','仕','相','馬','車']
        ];
        let sel = null;

        function draw() {
            ctx.clearRect(0,0,400,450);
            ctx.lineWidth = 1; ctx.strokeStyle = "#333";
            for(let i=0; i<10; i++) { ctx.beginPath(); ctx.moveTo(off, off+i*S); ctx.lineTo(off+8*S, off+i*S); ctx.stroke(); }
            for(let i=0; i<9; i++) { ctx.beginPath(); ctx.moveTo(off+i*S, off); ctx.lineTo(off+i*S, off+9*S); ctx.stroke(); }
            ctx.font = "24px KaiTi"; ctx.textAlign = "center";
            board.forEach((row, r) => row.forEach((p, c) => {
                if(p) {
                    ctx.fillStyle = "white"; ctx.beginPath(); ctx.arc(off+c*S, off+r*S, 18, 0, 7); ctx.fill(); ctx.stroke();
                    ctx.fillStyle = (sel && sel.r==r && sel.c==c) ? "blue" : (r<5 ? "black" : "red");
                    ctx.fillText(p, off+c*S, off+r*S+8);
                }
            }));
        }
        canvas.onclick = (e) => {
            const rect = canvas.getBoundingClientRect();
            const c = Math.round((e.clientX - rect.left - off) / S);
            const r = Math.round((e.clientY - rect.top - off) / S);
            if(sel) {
                if(board[r]) { board[r][c] = board[sel.r][sel.c]; board[sel.r][sel.c] = ''; }
                sel = null;
            } else if(board[r] && board[r][c]) { sel = {r, c}; }
            draw();
        };
        draw();
        // 進入頁面時小驚喜：自動彈出反重力漫畫 (模仿 antigravity)
        console.log("Antigravity loaded. Python is making you fly!");
    </script>
</body>
</html>
